version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-anti-fake-news
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anti_fake_news
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - anti-fake-news-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-anti-fake-news
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - anti-fake-news-network

  backend:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: backend-spring-anti-fake-news
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/anti_fake_news?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_JWT_SECRET: your_jwt_secret_key
      SPRING_JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - anti-fake-news-network

volumes:
  mysql-data:
    driver: local

networks:
  anti-fake-news-network:
    driver: bridge
